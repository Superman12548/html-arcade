<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Arcade</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #080b14;
    color: white;
}

body {
    min-height: 100vh;
}

header {
    height: 70px;
    background: #111625;
    border-bottom: 1px solid #252d43;
    display: flex;
    align-items: center;
    padding: 0 25px;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #6c7cff;
}

nav {
    display: flex;
    gap: 8px;
}

nav button {
    background: transparent;
    border: 0;
    color: #9da6bd;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

nav button:hover,
nav button.active {
    background: #20283e;
    color: white;
}

.spacer {
    flex: 1;
}

.upload {
    background: #6475ff;
    border: 0;
    color: white;
    padding: 11px 17px;
    border-radius: 9px;
    cursor: pointer;
    font-weight: bold;
    white-space: nowrap;
}

.upload:hover {
    background: #7887ff;
}

main {
    max-width: 1200px;
    margin: auto;
    padding: 35px 25px;
}

.hero {
    background: linear-gradient(135deg, #151c35, #101526);
    border: 1px solid #252e48;
    border-radius: 18px;
    padding: 40px;
    margin-bottom: 30px;
}

.hero h1 {
    margin: 0 0 10px;
    font-size: 38px;
}

.hero p {
    color: #9fa9c0;
    margin: 0 0 25px;
}

.bigUpload {
    display: inline-block;
    background: #6475ff;
    padding: 13px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

.bigUpload:hover {
    background: #7887ff;
}

input[type="file"] {
    display: none;
}

.sectionTitle {
    display: flex;
    align-items: center;
    margin-bottom: 18px;
}

.sectionTitle h2 {
    margin: 0;
}

#games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    border: 1px dashed #303a56;
    border-radius: 15px;
    color: #7f8aa5;
}

.game {
    background: #111625;
    border: 1px solid #252d43;
    border-radius: 14px;
    overflow: hidden;
    transition: .2s;
}

.game:hover {
    transform: translateY(-3px);
    border-color: #5265d9;
}

.gameImage {
    height: 135px;
    background: linear-gradient(135deg, #252d52, #171d32);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
}

.gameInfo {
    padding: 15px;
}

.gameInfo h3 {
    margin: 0 0 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.gameInfo p {
    color: #7f8aa5;
    font-size: 13px;
    margin: 0 0 15px;
}

.gameButtons {
    display: flex;
    gap: 8px;
}

.play {
    flex: 1;
    background: #6475ff;
    color: white;
    border: 0;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.play:hover {
    background: #7887ff;
}

.delete {
    background: #20283e;
    color: #ff8f8f;
    border: 0;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

.delete:hover {
    background: #38202a;
}

/* PLAYER */

#player {
    display: none;
    position: fixed;
    inset: 0;
    background: #05070d;
    z-index: 100;
}

.playerBar {
    height: 60px;
    background: #111625;
    border-bottom: 1px solid #252d43;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 12px;
}

.playerBar strong {
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.playerButton {
    background: #20283e;
    color: white;
    border: 0;
    padding: 9px 13px;
    border-radius: 8px;
    cursor: pointer;
}

.playerButton:hover {
    background: #303b5b;
}

#gameFrame {
    display: block;
    width: 100%;
    height: calc(100vh - 60px);
    border: 0;
    background: white;
}

/* When the game is fullscreen */
#gameFrame:fullscreen {
    width: 100vw;
    height: 100vh;
}

/* DROP AREA */

#dropArea {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(5, 8, 18, 0.92);
    align-items: center;
    justify-content: center;
}

#dropArea.active {
    display: flex;
}

.dropBox {
    border: 2px dashed #6475ff;
    border-radius: 20px;
    padding: 60px 90px;
    text-align: center;
    background: #151c35;
}

.dropBox h2 {
    margin-top: 0;
}

.dropBox p {
    color: #9fa9c0;
}

/* MOBILE */

@media(max-width:700px) {

    header {
        padding: 0 12px;
    }

    nav {
        display: none;
    }

    main {
        padding: 20px 12px;
    }

    .hero {
        padding: 25px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .upload {
        padding: 9px 12px;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        HTML <span>Arcade</span>
    </div>

    <nav>
        <button class="active" onclick="showHome()">
            Home
        </button>

        <button onclick="showLibrary()">
            My Games
        </button>
    </nav>

    <div class="spacer"></div>

    <label class="upload">
        + Upload Game
        <input
            type="file"
            id="fileInput"
            accept=".html,.htm"
        >
    </label>

</header>


<main id="home">

    <section class="hero">

        <h1>
            Play HTML Games 🎮
        </h1>

        <p>
            Upload an HTML game and run it directly in your browser.
        </p>

        <label class="bigUpload">
            Upload HTML Game
            <input
                type="file"
                id="heroFile"
                accept=".html,.htm"
            >
        </label>

    </section>


    <div class="sectionTitle">
        <h2>
            My Games
        </h2>
    </div>


    <section id="games">

        <div class="empty" id="empty">

            <div style="font-size:40px;">
                🎮
            </div>

            <h3>
                No games yet
            </h3>

            <p>
                Upload an HTML file to add your first game.
            </p>

        </div>

    </section>

</main>


<!-- GAME PLAYER -->

<div id="player">

    <div class="playerBar">

        <button
            class="playerButton"
            onclick="closeGame()">
            ← Back
        </button>

        <strong id="gameTitle">
            Game
        </strong>

        <div class="spacer"></div>

        <button
            class="playerButton"
            onclick="reloadGame()">
            ↻ Reload
        </button>

        <button
            class="playerButton"
            onclick="fullscreenGame()">
            ⛶ Fullscreen
        </button>

    </div>


    <iframe
        id="gameFrame"
        allow="
            fullscreen;
            autoplay;
            gamepad;
            microphone;
            camera;
            accelerometer;
            gyroscope;
            clipboard-read;
            clipboard-write
        "
        allowfullscreen>
    </iframe>

</div>


<!-- DRAG AND DROP -->

<div id="dropArea">

    <div class="dropBox">

        <h2>
            Drop your HTML game here 🎮
        </h2>

        <p>
            Release the file to open it.
        </p>

    </div>

</div>


<script>

/* =========================
   GAME STORAGE
========================= */

let games = [];

let currentGame = null;

let currentBlobURL = null;


/* =========================
   ELEMENTS
========================= */

const fileInput =
    document.getElementById("fileInput");

const heroFile =
    document.getElementById("heroFile");

const gamesContainer =
    document.getElementById("games");

const empty =
    document.getElementById("empty");

const player =
    document.getElementById("player");

const gameFrame =
    document.getElementById("gameFrame");

const gameTitle =
    document.getElementById("gameTitle");

const dropArea =
    document.getElementById("dropArea");


/* =========================
   FILE INPUT
========================= */

fileInput.addEventListener(
    "change",
    function() {

        if (this.files.length > 0) {
            handleFile(this.files[0]);
        }

        this.value = "";

    }
);


heroFile.addEventListener(
    "change",
    function() {

        if (this.files.length > 0) {
            handleFile(this.files[0]);
        }

        this.value = "";

    }
);


/* =========================
   LOAD HTML FILE
========================= */

function handleFile(file) {

    if (!file) {
        return;
    }


    const name =
        file.name.toLowerCase();


    if (
        !name.endsWith(".html") &&
        !name.endsWith(".htm")
    ) {

        alert(
            "Please upload an HTML file."
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload = function(event) {

        const game = {

            id:
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2),

            name:
                file.name.replace(
                    /\.(html|htm)$/i,
                    ""
                ),

            code:
                event.target.result

        };


        games.push(game);


        saveGames();

        renderGames();


        openGame(game);

    };


    reader.onerror = function() {

        alert(
            "Could not read that file."
        );

    };


    reader.readAsText(file);

}


/* =========================
   RENDER GAME LIBRARY
========================= */

function renderGames() {

    gamesContainer.innerHTML = "";


    if (games.length === 0) {

        gamesContainer.appendChild(
            empty
        );

        return;
    }


    games.forEach(function(game) {

        const card =
            document.createElement("div");


        card.className = "game";


        card.innerHTML = `

            <div class="gameImage">
                🎮
            </div>

            <div class="gameInfo">

                <h3>
                    ${escapeHTML(game.name)}
                </h3>

                <p>
                    HTML Game
                </p>

                <div class="gameButtons">

                    <button class="play">
                        ▶ Play
                    </button>

                    <button class="delete">
                        🗑
                    </button>

                </div>

            </div>

        `;


        card
            .querySelector(".play")
            .onclick = function() {

                openGame(game);

            };


        card
            .querySelector(".delete")
            .onclick = function() {

                deleteGame(game.id);

            };


        gamesContainer.appendChild(card);

    });

}


/* =========================
   OPEN GAME
========================= */

function openGame(game) {

    currentGame = game;


    gameTitle.textContent =
        game.name;


    /*
       IMPORTANT:

       Instead of srcdoc, create a
       real Blob URL.

       This is much more compatible
       with large HTML applications,
       WebGL, WebAssembly, etc.
    */

    if (currentBlobURL) {

        URL.revokeObjectURL(
            currentBlobURL
        );

        currentBlobURL = null;

    }


    const blob =
        new Blob(
            [game.code],
            {
                type:
                    "text/html;charset=utf-8"
            }
        );


    currentBlobURL =
        URL.createObjectURL(blob);


    /*
       Load the HTML as a real document.
    */

    gameFrame.src =
        currentBlobURL;


    player.style.display =
        "block";


    document.body.style.overflow =
        "hidden";

}


/* =========================
   CLOSE GAME
========================= */

function closeGame() {

    gameFrame.src =
        "about:blank";


    player.style.display =
        "none";


    document.body.style.overflow =
        "";


    currentGame = null;


    if (currentBlobURL) {

        URL.revokeObjectURL(
            currentBlobURL
        );

        currentBlobURL = null;

    }

}


/* =========================
   RELOAD GAME
========================= */

function reloadGame() {

    if (!currentGame) {
        return;
    }


    /*
       Reload the current Blob URL.
    */

    gameFrame.src =
        "about:blank";


    setTimeout(function() {

        if (currentBlobURL) {

            gameFrame.src =
                currentBlobURL;

        }

    }, 50);

}


/* =========================
   FULLSCREEN
========================= */

function fullscreenGame() {

    if (
        gameFrame.requestFullscreen
    ) {

        gameFrame.requestFullscreen();

        return;

    }


    if (
        gameFrame.webkitRequestFullscreen
    ) {

        gameFrame.webkitRequestFullscreen();

    }

}


/* =========================
   DELETE GAME
========================= */

function deleteGame(id) {

    const game =
        games.find(
            function(g) {
                return g.id === id;
            }
        );


    if (!game) {
        return;
    }


    const confirmed =
        confirm(
            'Delete "' +
            game.name +
            '"?'
        );


    if (!confirmed) {
        return;
    }


    games =
        games.filter(
            function(g) {
                return g.id !== id;
            }
        );


    saveGames();

    renderGames();

}


/* =========================
   SAVE GAMES
========================= */

function saveGames() {

    try {

        /*
           LocalStorage is used so the
           games stay available on this
           browser.
        */

        localStorage.setItem(
            "htmlArcadeGames",
            JSON.stringify(games)
        );

    } catch(error) {

        console.error(
            "Could not save games:",
            error
        );

    }

}


/* =========================
   LOAD GAMES
========================= */

function loadGames() {

    try {

        const saved =
            localStorage.getItem(
                "htmlArcadeGames"
            );


        if (saved) {

            games =
                JSON.parse(saved);

        }

    } catch(error) {

        console.error(
            "Could not load games:",
            error
        );

        games = [];

    }


    renderGames();

}


/* =========================
   HOME
========================= */

function showHome() {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================
   LIBRARY
========================= */

function showLibrary() {

    window.scrollTo({

        top:
            document.body.scrollHeight,

        behavior:
            "smooth"

    });

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =========================
   DRAG & DROP
========================= */

let dragCounter = 0;


document.addEventListener(
    "dragenter",
    function(event) {

        event.preventDefault();

        dragCounter++;

        dropArea.classList.add(
            "active"
        );

    }
);


document.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

    }
);


document.addEventListener(
    "dragleave",
    function(event) {

        event.preventDefault();

        dragCounter--;

        if (dragCounter <= 0) {

            dragCounter = 0;

            dropArea.classList.remove(
                "active"
            );

        }

    }
);


document.addEventListener(
    "drop",
    function(event) {

        event.preventDefault();

        dragCounter = 0;

        dropArea.classList.remove(
            "active"
        );


        const files =
            event.dataTransfer.files;


        if (!files.length) {
            return;
        }


        handleFile(files[0]);

    }
);


/* =========================
   ESC TO CLOSE
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            player.style.display === "block"
        ) {

            closeGame();

        }

    }
);


/* =========================
   INITIALIZE
========================= */

loadGames();

</script>

</body>
</html>
