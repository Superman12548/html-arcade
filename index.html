<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HTML Arcade</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background:#070a12;
    color:#fff;
    font-family:Inter,Arial,Helvetica,sans-serif;
}

body{
    overflow-x:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= HEADER ================= */

header{
    height:68px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 22px;
    background:#101522;
    border-bottom:1px solid #252d42;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    font-size:23px;
    font-weight:800;
    white-space:nowrap;
}

.logo span{
    color:#7282ff;
}

.nav{
    display:flex;
    gap:5px;
}

.nav button{
    border:0;
    background:transparent;
    color:#929cb5;
    padding:9px 13px;
    border-radius:8px;
}

.nav button:hover,
.nav button.active{
    background:#202940;
    color:#fff;
}

.spacer{
    flex:1;
}

.uploadButton{
    background:#6577ff;
    color:#fff;
    border:0;
    padding:10px 16px;
    border-radius:9px;
    font-weight:700;
}

.uploadButton:hover{
    background:#7788ff;
}

/* ================= MAIN ================= */

main{
    width:min(1200px,100%);
    margin:auto;
    padding:32px 22px 70px;
}

.hero{
    padding:42px;
    border:1px solid #29334d;
    border-radius:20px;
    background:
        radial-gradient(
            circle at 80% 20%,
            #26366d 0,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #151c31,
            #0d1220
        );
    margin-bottom:30px;
}

.hero h1{
    font-size:40px;
    margin:0 0 10px;
}

.hero p{
    color:#a3adc3;
    margin:0 0 24px;
    font-size:16px;
}

.bigUpload{
    display:inline-block;
    background:#6577ff;
    padding:12px 19px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
}

.bigUpload:hover{
    background:#7788ff;
}

input[type=file]{
    display:none;
}

/* ================= LIBRARY ================= */

.libraryHeader{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.libraryHeader h2{
    margin:0;
}

.search{
    margin-left:auto;
    background:#111827;
    border:1px solid #2a344d;
    color:#fff;
    border-radius:9px;
    padding:10px 13px;
    width:230px;
    outline:none;
}

.search:focus{
    border-color:#6577ff;
}

#games{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(240px,1fr));
    gap:18px;
}

.empty{
    grid-column:1/-1;
    border:1px dashed #34405c;
    border-radius:16px;
    text-align:center;
    padding:65px 20px;
    color:#7f8aa3;
}

.emptyIcon{
    font-size:48px;
    margin-bottom:10px;
}

.game{
    overflow:hidden;
    border:1px solid #28324a;
    border-radius:15px;
    background:#101521;
    transition:
        transform .15s,
        border-color .15s;
}

.game:hover{
    transform:translateY(-3px);
    border-color:#596bdf;
}

.gameImage{
    height:140px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle,
            #2d3a76,
            #151b2e 65%
        );
    font-size:52px;
}

.gameInfo{
    padding:15px;
}

.gameTitle{
    font-weight:700;
    margin-bottom:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.gameType{
    color:#7e89a3;
    font-size:13px;
    margin-bottom:14px;
}

.gameButtons{
    display:flex;
    gap:7px;
}

.playButton{
    flex:1;
    border:0;
    border-radius:8px;
    padding:10px;
    background:#6577ff;
    color:#fff;
    font-weight:700;
}

.playButton:hover{
    background:#7888ff;
}

.deleteButton{
    border:0;
    border-radius:8px;
    padding:10px 12px;
    color:#ff9292;
    background:#222a3d;
}

.deleteButton:hover{
    background:#39232d;
}

/* ================= PLAYER ================= */

#player{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:#000;
}

.playerBar{
    height:58px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 12px;
    background:#101522;
    border-bottom:1px solid #252d42;
}

.playerBar button{
    border:0;
    border-radius:8px;
    padding:9px 13px;
    color:#fff;
    background:#202940;
}

.playerBar button:hover{
    background:#303b5a;
}

#gameTitle{
    max-width:35vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

#gameFrame{
    display:block;
    width:100%;
    height:calc(100vh - 58px);
    border:0;
    background:#000;
}

/*
   Important:
   No sandbox is used here.

   This gives complex HTML games much
   better compatibility with WebGL,
   WebAssembly, workers, keyboard input,
   IndexedDB, audio, etc.
*/

#gameFrame:fullscreen{
    width:100vw;
    height:100vh;
}

/* ================= DROP ZONE ================= */

#dropZone{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    align-items:center;
    justify-content:center;
    background:rgba(4,7,14,.94);
}

#dropZone.active{
    display:flex;
}

.dropBox{
    width:min(600px,90%);
    text-align:center;
    padding:65px 30px;
    border:2px dashed #687aff;
    border-radius:22px;
    background:#151c31;
}

.dropBox h2{
    margin:0 0 10px;
    font-size:28px;
}

.dropBox p{
    color:#9ba6be;
}

/* ================= TOAST ================= */

#toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:
        translateX(-50%)
        translateY(20px);
    opacity:0;
    pointer-events:none;
    background:#202940;
    border:1px solid #34415f;
    color:#fff;
    padding:11px 17px;
    border-radius:10px;
    z-index:5000;
    transition:.2s;
}

#toast.show{
    opacity:1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    header{
        padding:0 12px;
        gap:10px;
    }

    .nav{
        display:none;
    }

    .uploadButton{
        padding:9px 11px;
    }

    main{
        padding:20px 12px 50px;
    }

    .hero{
        padding:28px 22px;
    }

    .hero h1{
        font-size:30px;
    }

    .libraryHeader{
        flex-wrap:wrap;
    }

    .search{
        width:100%;
        margin-left:0;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        HTML <span>Arcade</span>
    </div>

    <div class="nav">
        <button
            class="active"
            id="homeButton"
            onclick="goHome()">
            Home
        </button>

        <button
            onclick="goLibrary()">
            My Games
        </button>
    </div>

    <div class="spacer"></div>

    <label class="uploadButton">
        + Upload
        <input
            id="fileInput"
            type="file"
            accept=".html,.htm">
    </label>

</header>


<main id="main">

    <section class="hero">

        <h1>
            Play HTML Games 🎮
        </h1>

        <p>
            Upload HTML games and play them directly
            in your browser.
        </p>

        <label class="bigUpload">
            Upload HTML Game
            <input
                id="heroFile"
                type="file"
                accept=".html,.htm">
        </label>

    </section>


    <section>

        <div class="libraryHeader">

            <h2>
                My Games
            </h2>

            <input
                id="search"
                class="search"
                type="text"
                placeholder="Search games...">

        </div>


        <div id="games"></div>

    </section>

</main>


<!-- ================= GAME PLAYER ================= -->

<div id="player">

    <div class="playerBar">

        <button onclick="closeGame()">
            ← Back
        </button>

        <strong id="gameTitle">
            Game
        </strong>

        <div class="spacer"></div>

        <button onclick="reloadGame()">
            ↻ Reload
        </button>

        <button onclick="fullscreenGame()">
            ⛶ Fullscreen
        </button>

    </div>


    <iframe
        id="gameFrame"
        title="HTML Game"
        allow="
            fullscreen;
            autoplay;
            gamepad;
            microphone;
            camera;
            accelerometer;
            gyroscope;
            clipboard-read;
            clipboard-write;
            web-share
        "
        allowfullscreen>
    </iframe>

</div>


<!-- ================= DROP ZONE ================= -->

<div id="dropZone">

    <div class="dropBox">

        <h2>
            Drop your game here 🎮
        </h2>

        <p>
            Release the HTML file to open it.
        </p>

    </div>

</div>


<div id="toast"></div>


<script>

/* =====================================================
   STATE
===================================================== */

let games = [];

let currentGame = null;

let currentBlobURL = null;

let dragCounter = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const fileInput =
    document.getElementById("fileInput");

const heroFile =
    document.getElementById("heroFile");

const gamesContainer =
    document.getElementById("games");

const player =
    document.getElementById("player");

const gameFrame =
    document.getElementById("gameFrame");

const gameTitle =
    document.getElementById("gameTitle");

const search =
    document.getElementById("search");

const dropZone =
    document.getElementById("dropZone");

const toast =
    document.getElementById("toast");


/* =====================================================
   FILE INPUTS
===================================================== */

fileInput.addEventListener(
    "change",
    event => {

        if(event.target.files[0]){
            handleFile(
                event.target.files[0]
            );
        }

        event.target.value = "";

    }
);


heroFile.addEventListener(
    "change",
    event => {

        if(event.target.files[0]){
            handleFile(
                event.target.files[0]
            );
        }

        event.target.value = "";

    }
);


/* =====================================================
   READ HTML
===================================================== */

function handleFile(file){

    const filename =
        file.name.toLowerCase();


    if(
        !filename.endsWith(".html") &&
        !filename.endsWith(".htm")
    ){

        showToast(
            "Please choose an HTML file."
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        event => {

            const game = {

                id:
                    crypto.randomUUID
                    ? crypto.randomUUID()
                    :
                    Date.now() +
                    "-" +
                    Math.random(),

                name:
                    file.name.replace(
                        /\.(html|htm)$/i,
                        ""
                    ),

                code:
                    event.target.result,

                added:
                    Date.now()

            };


            games.push(game);

            saveGames();

            renderGames();

            openGame(game);

        };


    reader.onerror =
        () => {

            showToast(
                "Couldn't read that file."
            );

        };


    reader.readAsText(file);

}


/* =====================================================
   RENDER
===================================================== */

function renderGames(){

    const query =
        search.value
            .trim()
            .toLowerCase();


    gamesContainer.innerHTML = "";


    const filtered =
        games.filter(
            game =>
                game.name
                    .toLowerCase()
                    .includes(query)
        );


    if(filtered.length === 0){

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.innerHTML = `

            <div class="emptyIcon">
                🎮
            </div>

            <h3>
                ${
                    games.length === 0
                    ? "No games yet"
                    : "No games found"
                }
            </h3>

            <p>
                ${
                    games.length === 0
                    ? "Upload an HTML game to get started."
                    : "Try another search."
                }
            </p>

        `;

        gamesContainer.appendChild(empty);

        return;
    }


    filtered.forEach(game => {

        const card =
            document.createElement("div");

        card.className = "game";


        card.innerHTML = `

            <div class="gameImage">
                🎮
            </div>

            <div class="gameInfo">

                <div class="gameTitle">
                    ${escapeHTML(game.name)}
                </div>

                <div class="gameType">
                    HTML Game
                </div>

                <div class="gameButtons">

                    <button
                        class="playButton">
                        ▶ Play
                    </button>

                    <button
                        class="deleteButton"
                        title="Delete">
                        🗑
                    </button>

                </div>

            </div>

        `;


        card
            .querySelector(".playButton")
            .onclick =
                () => openGame(game);


        card
            .querySelector(".deleteButton")
            .onclick =
                () => deleteGame(game.id);


        gamesContainer.appendChild(card);

    });

}


/* =====================================================
   OPEN GAME
===================================================== */

function openGame(game){

    currentGame = game;


    gameTitle.textContent =
        game.name;


    /*
       Remove old Blob URL.
    */

    if(currentBlobURL){

        URL.revokeObjectURL(
            currentBlobURL
        );

        currentBlobURL = null;

    }


    /*
       Create a real HTML document URL.

       This is much better for large games
       than iframe.srcdoc.
    */

    const blob =
        new Blob(
            [game.code],
            {
                type:
                    "text/html;charset=utf-8"
            }
        );


    currentBlobURL =
        URL.createObjectURL(blob);


    gameFrame.src =
        currentBlobURL;


    player.style.display =
        "block";


    document.body.style.overflow =
        "hidden";


    /*
       Give the game keyboard focus.

       This is especially important for
       Eaglercraft and other keyboard games.
    */

    setTimeout(
        focusGame,
        250
    );

}


/* =====================================================
   GAME FOCUS
===================================================== */

function focusGame(){

    try{

        gameFrame.focus();

    }catch(error){

        console.log(error);

    }

}


/*
   When the game finishes loading,
   focus it automatically.
*/

gameFrame.addEventListener(
    "load",
    () => {

        setTimeout(
            focusGame,
            100
        );

    }
);


/*
   Clicking the game gives it focus.
*/

gameFrame.addEventListener(
    "mouseenter",
    focusGame
);

gameFrame.addEventListener(
    "click",
    focusGame
);


/* =====================================================
   KEYBOARD HANDLING
===================================================== */

/*
   IMPORTANT:

   Do NOT prevent WASD here.

   The game iframe receives the keyboard
   events instead.
*/

document.addEventListener(
    "keydown",
    event => {

        /*
           Escape closes the player.

           Only do this when the game is open.
        */

        if(
            event.key === "Escape" &&
            player.style.display === "block"
        ){

            /*
               Don't close if the browser is
               currently in fullscreen.
            */

            if(
                document.fullscreenElement
            ){

                return;

            }

            closeGame();

        }

    }
);


/* =====================================================
   CLOSE GAME
===================================================== */

function closeGame(){

    gameFrame.src =
        "about:blank";


    player.style.display =
        "none";


    document.body.style.overflow =
        "";


    currentGame = null;


    if(currentBlobURL){

        URL.revokeObjectURL(
            currentBlobURL
        );

        currentBlobURL = null;

    }

}


/* =====================================================
   RELOAD
===================================================== */

function reloadGame(){

    if(!currentGame){
        return;
    }


    /*
       Recreate the Blob URL.

       This completely resets the game.
    */

    if(currentBlobURL){

        URL.revokeObjectURL(
            currentBlobURL
        );

    }


    const blob =
        new Blob(
            [currentGame.code],
            {
                type:
                    "text/html;charset=utf-8"
            }
        );


    currentBlobURL =
        URL.createObjectURL(blob);


    gameFrame.src =
        currentBlobURL;


    setTimeout(
        focusGame,
        250
    );

}


/* =====================================================
   FULLSCREEN
===================================================== */

function fullscreenGame(){

    if(
        gameFrame.requestFullscreen
    ){

        gameFrame.requestFullscreen();

        return;

    }


    if(
        gameFrame.webkitRequestFullscreen
    ){

        gameFrame.webkitRequestFullscreen();

    }

}


/* =====================================================
   DELETE
===================================================== */

function deleteGame(id){

    const game =
        games.find(
            g => g.id === id
        );


    if(!game){
        return;
    }


    if(
        !confirm(
            `Delete "${game.name}"?`
        )
    ){

        return;

    }


    games =
        games.filter(
            g => g.id !== id
        );


    saveGames();

    renderGames();


    showToast(
        "Game deleted."
    );

}


/* =====================================================
   STORAGE
===================================================== */

function saveGames(){

    try{

        localStorage.setItem(
            "htmlArcadeGames",
            JSON.stringify(games)
        );

    }catch(error){

        console.error(
            "Storage error:",
            error
        );


        showToast(
            "This game is too large to save locally."
        );

    }

}


function loadGames(){

    try{

        const saved =
            localStorage.getItem(
                "htmlArcadeGames"
            );


        if(saved){

            games =
                JSON.parse(saved);

        }

    }catch(error){

        console.error(
            "Load error:",
            error
        );

        games = [];

    }


    renderGames();

}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    renderGames
);


/* =====================================================
   NAVIGATION
===================================================== */

function goHome(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function goLibrary(){

    document
        .querySelector("#games")
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* =====================================================
   DRAG & DROP
===================================================== */

document.addEventListener(
    "dragenter",
    event => {

        event.preventDefault();

        dragCounter++;

        dropZone.classList.add(
            "active"
        );

    }
);


document.addEventListener(
    "dragover",
    event => {

        event.preventDefault();

    }
);


document.addEventListener(
    "dragleave",
    event => {

        event.preventDefault();

        dragCounter--;


        if(dragCounter <= 0){

            dragCounter = 0;

            dropZone.classList.remove(
                "active"
            );

        }

    }
);


document.addEventListener(
    "drop",
    event => {

        event.preventDefault();

        dragCounter = 0;

        dropZone.classList.remove(
            "active"
        );


        const file =
            event.dataTransfer.files[0];


        if(file){

            handleFile(file);

        }

    }
);


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

loadGames();

</script>

</body>
</html>
